<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotesVerse</title>
<style>
  :root{
    --bg:#ffffff; --navy:#1a2a6c; --navy-2:#2c3d95; --text:#14161f;
    --border:#d9e0f2; --panel:#eef2fb; --red:#b5324a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Georgia","Iowan Old Style",serif; color:var(--text);
    display:flex; align-items:center; justify-content:center; height:100vh;
    background:linear-gradient(160deg,#eef2fb 0%,#dfe6fa 100%);
  }
  .lock-card{
    background:var(--bg); border-radius:16px; padding:38px 34px 34px; width:360px; max-width:90vw;
    box-shadow:0 14px 40px rgba(26,42,108,.16); text-align:center;
  }
  .brand-mark{
    width:52px; height:52px; margin:0 auto 12px; border-radius:14px;
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    display:flex; align-items:center; justify-content:center; font-size:24px;
    box-shadow:0 6px 16px rgba(26,42,108,.35);
  }
  .brand-name{
    font-size:32px; font-weight:700; letter-spacing:-.5px; margin:0;
    background:linear-gradient(120deg,var(--navy) 30%,var(--navy-2) 90%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-name em{font-style:italic; font-weight:400;}
  .brand-tag{
    font-family:-apple-system,sans-serif; font-size:11.5px; letter-spacing:.06em;
    text-transform:uppercase; color:#9aa2c0; margin:2px 0 22px;
  }
  .divider{height:1px; background:var(--border); margin:0 0 22px;}
  p.hint{font-family:-apple-system,sans-serif; font-size:13px; color:#6b7086; margin:0 0 18px;}
  input{
    width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:8px;
    font-family:-apple-system,sans-serif; font-size:14px; margin-bottom:12px; background:#fff; color:var(--text);
  }
  input:focus{outline:2px solid var(--navy-2); outline-offset:1px;}
  button{
    width:100%; padding:11px 14px; border:none; border-radius:8px; background:var(--navy); color:#fff;
    font-family:-apple-system,sans-serif; font-size:14px; font-weight:600; cursor:pointer;
  }
  button:hover{background:var(--navy-2);}
  .error{color:var(--red); font-family:-apple-system,sans-serif; font-size:12.5px; margin-top:10px; min-height:16px;}
</style>
</head>
<body>
  <div class="lock-card">
    <div class="brand-mark">📓</div>
    <h1 class="brand-name">Notes<em>Verse</em></h1>
    <div class="brand-tag">Your revision, all in one place</div>
    <div class="divider"></div>
    <p class="hint">🔒 Enter your password to continue</p>
    <input type="password" id="pw" placeholder="Password" autofocus onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Unlock</button>
    <div class="error" id="err"></div>
  </div>
<script>
function doLogin() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: pw })
  })
    .then(async (res) => {
      const data = await res.json();
      if (res.ok) {
        window.location.href = "/";
      } else {
        err.textContent = data.error || "Wrong password.";
      }
    })
    .catch(() => { err.textContent = "Couldn't reach the server."; });
}
</script>
</body>
</html>
